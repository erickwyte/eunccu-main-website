{% load static %}

{% block content %}
<style>
    .form-container {
        max-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 20px rgb(22, 90, 5);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-container .logo {
        display: block;
        margin: 0 auto 1.5rem;
        max-width: 150px;
        height: auto;
    }

    .form-container h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 1.5rem;
        font-weight: 600;
    }

    .form-container label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2c3e50;
        font-weight: 500;
    }

    .form-container input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-container input[type="password"]:focus {
        outline: none;
            border-color: #2c8e22;
            box-shadow: 0 0 0 2px rgba(26, 92, 42, 0.2);
    .form-actions {
        margin-top: 2rem;
    }

    .form-container button[type="submit"] {
        width: 100%;
        padding: 0.75rem;
            background-color: #2c8e22;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button[type="submit"]:hover {
            background-color: #ff0019;
        padding: 0.75rem 1.25rem;
        margin-bottom: 1rem;
        border-radius: 4px;
    }

    .alert-success {
        background-color: #d4edda;
        color: #2c8e22;
        border: 1px solid #c3e6cb;
    }

    .alert-error {
        background-color: #f8d7da;
        color: #ff0019;
        border: 1px solid #f5c6cb;
    }

    .alert-info {
        background-color: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
    }

    .password-strength {
        margin-top: -1rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: #7f8c8d;
    }
</style>

<div class="form-container">
    {% if messages %}
    <div class="container mt-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <img src="{% static 'img/logo2.png' %}" alt="Egerton University Njoro Campus Christian Union Logo" class="logo">
    <h2 style="color:rgba(43, 141, 21, 1);">Set New Password</h2>
    
    <form method="post" id="resetPasswordForm" action="">
        {% csrf_token %}
        <label for="new_password1">New Password</label>
        <input type="password" id="new_password1" name="new_password1" required>
        <div class="password-strength">(Must be at least 8 characters)</div>
        
        <label for="new_password2">Confirm Password</label>
        <input type="password" id="new_password2" name="new_password2" required>
        
        <div class="form-actions">
            <button style="background-color:#1a5c2a;" type="submit">Reset Password</button>
        </div>
    </form>
</div>

<script>
    // Simple password strength indicator (optional)
    document.getElementById('new_password1').addEventListener('input', function() {
        const password = this.value;
        const strengthText = document.querySelector('.password-strength');
        
        if (password.length === 0) {
            strengthText.textContent = '(Must be at least 8 characters)';
        } else if (password.length < 8) {
            strengthText.textContent = 'Weak (too short)';
            strengthText.style.color = '#ff1900';
        } else if (password.length < 12) {
            strengthText.textContent = 'Medium';
            strengthText.style.color = '#f39c12';
        } else {
            strengthText.textContent = 'Strong';
            strengthText.style.color = '#2c8e22';
        }
    });
</script>
{% endblock %}
