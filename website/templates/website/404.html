<!-- templates/404.html -->
{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1">404</h1>
    <h2 class="display-4">Page Not Found</h2>
    <p class="lead">We couldn't find the page you were looking for.</p>
    <p>You might have typed the wrong address or the page may have moved.</p>
    <a href="{% url 'index' %}" class="btn btn-primary mt-3">Return to Home</a>
</div>
{% endblock %}
<style>
    .error-container {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .error-code {
        font-size: 5rem;
        font-weight: bold;
        color: #dc3545;
    }
</style>
