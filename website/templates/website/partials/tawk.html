<!--Start of Tawk.to Script-->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
Tawk_API.onLoad = function(){
    // Set visitor attributes
    if (window.userInfo) {
        Tawk_API.setAttributes({
            'name': window.userInfo.name,
            'email': window.userInfo.email,
            'userType': window.userInfo.userType  // student/alumnus
        });
    }
};

// Pre-define chat options
Tawk_API.onChatStarted = function(){
    Tawk_API.addEvent('chat-started', {
        'timestamp': new Date()
    });
};

(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
s1.async=true;
s1.src='https://embed.tawk.to/YOUR_TAWK_TO_ID/default';
s1.charset='UTF-8';
s1.setAttribute('crossorigin','*');
s0.parentNode.insertBefore(s1,s0);
})();
</script>
<!--End of Tawk.to Script-->
